<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Email — MAIL INDIA</title>
  <script>
    (function() {
      var qs = window.location.search || '';
      var backendEndpoint = 'https://mail-india-beta.vercel.app/api/auth/verify-action' + qs;
      window.location.replace(backendEndpoint);
    })();
  </script>
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
    }
    .card {
      background: #151c2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 66, 220, 0.18);
      border: 1px solid rgba(99, 66, 220, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #c7d2fe;
      margin-bottom: 24px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">✉️ MAIL INDIA CLOUD RELAY</div>
    <div style="font-size:48px;margin-bottom:16px;">🔄</div>
    <h1>Connecting to Verification Server</h1>
    <p>Please wait a moment while MAIL INDIA verifies your account...</p>
    <a id="fallback-btn" href="#" class="btn">Click here if not redirected automatically</a>
  </div>
  <script>
    var btn = document.getElementById('fallback-btn');
    if (btn) {
      btn.href = 'https://mail-india-beta.vercel.app/api/auth/verify-action' + (window.location.search || '');
    }
  </script>
</body>
</html>
